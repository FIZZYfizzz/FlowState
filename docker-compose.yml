services:
  flowstate-postgres:
    image: postgres:16
    container_name: flowstate-postgres
    environment:
      POSTGRES_DB: flowstate_planner
      POSTGRES_USER: flowstate
      POSTGRES_PASSWORD: flowstate_dev_password
    ports:
      - "5432:5432"
    volumes:
      - flowstate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstate -d flowstate_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  flowstate-postgres-data:
